# Все workflow в одном файле.
# `defaults:` применяется к каждому флоу; в самом флоу — только то, что
# отличается (например путь к template или переопределённый lora_loaders).
#
# Ключ блока должен совпадать со значением в колонке `workflow` в jobs.csv.

defaults:
  ksampler: { node: "348" }
  positive_prompt: { node: "622" }
  negative_prompt: { node: "343" }
  load_images:
    main: { node: "617" }
  save_images: ["620"]
  lora_loaders:
    - node: "621"

workflows:
  sample_image_v1:
    template: jobs/sample_image_v1.json

  # Krea2 Edit (BigLove) — img2img/edit stage. Grounded-encode prompts live in
  # an `inputs.prompt` string (no CLIPTextEncode). Needs the comfyui-krea2edit
  # nodes + BigLoveKreaEdit1_bf16 / qwen3vl_4b / qwen_image_vae on the pod.
  krea2_regina_1:
    template: jobs/krea2_regina_1.json
    ksampler: { node: "53" }
    positive_prompt: { node: "84", field: prompt }
    negative_prompt: { node: "85", field: prompt }
    load_images:
      main: { node: "93" }
    save_images: ["29"]
    lora_loaders: []
    # ResolutionSelector на поде требует обязательный виджет `multiple`, которого
    # нет в API-экспорте (нода новее). Добиваем из конфига, не трогая шаблон.
    set_fields:
      "83": { multiple: 16 }

  # Krea2 (BigLove) — txt2img generate stage. No input image
  # (EmptySD3LatentImage), so load_images is intentionally empty.
  krea2_regina_2:
    template: jobs/krea2_regina_2.json
    ksampler: { node: "193" }
    positive_prompt: { node: "211" }
    negative_prompt: { node: "299" }
    load_images: {}
    save_images: ["9"]
    lora_loaders: []

  # Regina Klein — Flux 2, два этапа в ОДНОМ графе (A: img2img по входной
  # картинке → B: конвертация в фотореализм через ReferenceLatent). CSV правит
  # только этап A (промпт сцены + сэмплер ноды 348); промпты/сид этапа B (626/
  # 629/632) фиксированы в шаблоне. ВАЖНО: в CSV задавать steps=4, cfg=1,
  # sampler_name=euler, scheduler=beta — иначе дефолты раннера сломают 4-шаговый
  # Flux2. Нужен Flux2-стек на поде (KSamplerWithNAG, LayerStyle, ReferenceLatent,
  # EmptyFlux2LatentImage + BigLoveKlein3_bf16 / qwen_3_8b / flux2-vae).
  regina_klein_2etapa:
    template: jobs/regina_klein_2etapa.json
    ksampler: { node: "348" }
    positive_prompt: { node: "338" }
    negative_prompt: { node: "343" }
    load_images:
      main: { node: "617" }
    save_images: ["620", "634"]
    lora_loaders:
      - node: "621"
