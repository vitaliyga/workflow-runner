<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Workflow Runner</title>
<link rel="stylesheet" href="/static/app.css?v=2" />
</head>
<body data-run-type="image">
<header>
  <h1>Workflow Runner</h1>
  <nav>
    <a href="/" class="active">Прогон</a>
    <a href="/scenarios">Сценарии</a>
    <a href="/video">Видео</a>
    <a href="/settings">Настройки</a>
  </nav>
</header>

<main>
  <section id="upload" class="card">
    <h2>1. Загрузить задания</h2>
    <div class="row">
      <label class="drop" id="csv-drop">
        <input type="file" id="csv-input" accept=".csv,text/csv" hidden />
        <div class="drop-body">
          <strong>jobs.csv</strong>
          <small>перетащи сюда CSV или нажми</small>
          <em id="csv-name"></em>
        </div>
      </label>

      <label class="drop" id="photos-drop">
        <input type="file" id="photos-input" multiple
               accept="image/png,image/jpeg,image/webp" hidden />
        <div class="drop-body">
          <strong>входные фото</strong>
          <small>можно несколько; имена должны совпадать с input_image / input_images в CSV</small>
          <em id="photos-name"></em>
        </div>
      </label>
    </div>
    <div class="actions">
      <button id="btn-create" disabled>Создать прогон</button>
      <span id="create-msg" class="muted"></span>
    </div>
  </section>

  <section id="run" class="card hidden">
    <h2>2. Прогресс <small id="run-id" class="muted"></small></h2>
    <div id="hint" class="hint hidden"></div>
    <div id="counts" class="counts"></div>
    <div class="actions">
      <button id="btn-start">▶ Запустить генерацию</button>
      <button id="btn-cancel" class="ghost">Отменить</button>
      <span id="start-msg" class="muted"></span>
    </div>
    <table id="jobs">
      <thead><tr>
        <th>#</th>
        <th>Workflow</th>
        <th>Subject</th>
        <th>Model</th>
        <th>Промт</th>
        <th>Seed</th>
        <th>Статус</th>
        <th>Превью</th>
        <th>Файлы</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="history" class="card">
    <h2>Прошлые прогоны</h2>
    <div id="archive-msg" class="muted"></div>
    <table id="history-table">
      <thead><tr>
        <th>ID</th><th>Заданий</th><th>OK</th><th>Ошибок</th>
        <th>Начат</th><th>Действия</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<div id="preview-lightbox" class="lightbox hidden" aria-hidden="true">
  <button type="button" class="lightbox-backdrop" data-close="1" aria-label="Закрыть"></button>
  <button type="button" class="lightbox-close" data-close="1" aria-label="Закрыть">×</button>
  <button type="button" class="lightbox-nav lightbox-prev" data-prev="1" aria-label="Предыдущее">‹</button>
  <button type="button" class="lightbox-nav lightbox-next" data-next="1" aria-label="Следующее">›</button>
  <div class="lightbox-stage">
    <img id="lightbox-image" alt="" />
    <div class="lightbox-meta">
      <span id="lightbox-caption"></span>
      <span id="lightbox-counter"></span>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
